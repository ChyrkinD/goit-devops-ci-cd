controller:
  image:
    tag: "lts-jdk17"
  admin:
    username: "admin"
    password: "<set-me>"
  serviceType: LoadBalancer
  installPlugins:
    - kubernetes:latest
    - workflow-aggregator:latest
    - git:latest
    - credentials-binding:latest
    - docker-workflow:latest
    - blueocean:latest
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  JCasC:
    enabled: true
    defaultConfig: true
    configScripts:
      credentials: |
        credentials:
          system:
            domainCredentials:
              - domain:
                  name: "global"
                  description: "Global domain"
                credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "aws-creds"
                      username: "admin"
                      password: "<set-me>"
                      description: "AWS credentials"
