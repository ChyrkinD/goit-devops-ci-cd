applications:
  - name: django-app
    namespace: default
    project: default
    source:
      repoURL: https://github.com/example/argocd-demo.git
      targetRevision: main
      path: charts/django-app
    destination:
      server: https://kubernetes.default.svc
      namespace: default
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
repositories:
  - name: app-repo
    url: https://github.com/example/argocd-demo.git
    username: ""
    password: ""
    insecure: false
    enableLfs: false
